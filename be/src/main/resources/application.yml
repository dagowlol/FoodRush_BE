# Khi chay local bang `mvn spring-boot:run`, tro ve file .env o thu muc goc repo
# de dung chung mot file voi docker compose. Docker khong dung muc nay,
# no nhan bien moi truong truc tiep tu compose.
springdotenv:
  directory: ../..

spring:
  application:
    name: foodrush-be
  servlet:
    multipart:
      max-file-size: ${CLOUDINARY_MAX_FILE_SIZE:5MB}
      max-request-size: ${CLOUDINARY_MAX_REQUEST_SIZE:6MB}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: sub

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodrush?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Leave empty to auto-generate an ephemeral dev secret (tokens are invalidated on restart).
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  coin:
    score-divisor: ${COIN_SCORE_DIVISOR:10}
    daily-earning-cap: ${DAILY_COIN_EARNING_CAP:150}
  coupon:
    expiry-days: ${COUPON_EXPIRY_DAYS:7}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:five-star/vouchers}
    max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:5242880}
    allowed-content-types: image/jpeg,image/png,image/webp
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  admin:
    # Tài khoản quản trị tạo sẵn giống tài khoản nhân viên.
    username: ${ADMIN_USERNAME:admin}
    display-name: ${ADMIN_DISPLAY_NAME:Quản trị Five Star}
    # Để trống => app tự sinh mật khẩu ngẫu nhiên 16 ký tự và ghi ra admin-password-file.
    password: ${ADMIN_PASSWORD:}
    password-file: ${ADMIN_PASSWORD_FILE:admin-credentials.txt}
    # Nếu tài khoản có email này đã tồn tại thì được nâng lên vai trò ADMIN.
    # Cũng được dùng làm email cho tài khoản admin tạo sẵn nếu username ở trên chưa tồn tại.
    email: ${ADMIN_EMAIL:}
  seed:
    enabled: ${SEED_ENABLED:true}
    staff-username: ${SEED_STAFF_USERNAME:staff}
    staff-email: ${SEED_STAFF_EMAIL:staff@fivestar.local}
    # Leave empty to auto-generate a random staff password (written to staff-password-file, never logged).
    staff-password: ${SEED_STAFF_PASSWORD:}
    staff-display-name: ${SEED_STAFF_DISPLAY_NAME:Nhân viên Five Star}
    staff-password-file: ${SEED_STAFF_PASSWORD_FILE:staff-credentials.txt}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    sender-name: ${OTP_SENDER_NAME:FoodRush}
    sender-email: ${OTP_SENDER_EMAIL:}
